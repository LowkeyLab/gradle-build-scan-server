name: Pages
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches: [main]
jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          bazelrc: |
            common --config=ci
            build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Install Aspect CLI
        run: |
          ASPECT_VERSION="2026.4.2"
          ASPECT_SHA256="58057a7bfb94838749cbb3fedc015baeefa1887caf00e1ed4dd5eb8ef00c6cef"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/aspect-build/aspect-cli/releases/download/v${ASPECT_VERSION}/aspect-cli-x86_64-unknown-linux-musl" -o "$HOME/.local/bin/aspect"
          echo "${ASPECT_SHA256}  $HOME/.local/bin/aspect" | sha256sum --check
          chmod +x "$HOME/.local/bin/aspect"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify aspect CLI
        run: aspect --version
      - name: Build docs
        run: |
          bazel build //docs:build --action_env=DOCS_SITE --action_env=DOCS_BASE
        env:
          DOCS_SITE: https://lowkeylab.github.io/gradle-build-scan-server/
          DOCS_BASE: /gradle-build-scan-server/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bazel-bin/docs/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
