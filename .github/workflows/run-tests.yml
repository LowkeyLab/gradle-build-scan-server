name: Tests
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  MISE_EXPERIMENTAL: true
  DOCS_SITE: https://lowkeylab.github.io/gradle-build-scan-server/
  DOCS_BASE: /gradle-build-scan-server/
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          bazelrc: |
            common --config=ci
            build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            test --test_env=XDG_CACHE_HOME
      - name: Install Aspect CLI
        run: |
          ASPECT_VERSION="2026.4.2"
          ASPECT_SHA256="58057a7bfb94838749cbb3fedc015baeefa1887caf00e1ed4dd5eb8ef00c6cef"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/aspect-build/aspect-cli/releases/download/v${ASPECT_VERSION}/aspect-cli-x86_64-unknown-linux-musl" -o "$HOME/.local/bin/aspect"
          echo "${ASPECT_SHA256}  $HOME/.local/bin/aspect" | sha256sum --check
          chmod +x "$HOME/.local/bin/aspect"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify aspect CLI
        run: aspect --version
      - name: Run Bazel Lints
        run: |
          aspect lint //...
      - name: Run Bazel tests
        run: |
          aspect test //...
      - name: Build docs
        run: |
          bazel build //docs:build --action_env=DOCS_SITE --action_env=DOCS_BASE
