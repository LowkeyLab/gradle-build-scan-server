name: Tests
permissions:
  contents: read
  pull-requests: write
  packages: write
  attestations: write
  id-token: write
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  MISE_EXPERIMENTAL: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          bazelrc: |
            common --config=ci
            build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            test --test_env=XDG_CACHE_HOME
      - name: Install Aspect CLI
        run: |
          curl -sSL https://github.com/aspect-build/aspect-cli/releases/latest/download/aspect-cli-x86_64-unknown-linux-musl -o /usr/local/bin/aspect
          chmod +x /usr/local/bin/aspect
      - name: Verify aspect CLI
        run: aspect --version
      - name: Run Bazel Lints
        run: |
          aspect lint //...
      - name: Run Bazel tests
        run: |
          aspect test //...
